name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  APP_NAME: ModelCraft
  SCHEME: ModelCraft
  PROJECT: ModelCraft.xcodeproj

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # actions/checkout stores the pushed tag as a lightweight ref; refetch it to keep the annotation.
      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Resolve version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=

      - name: Verify version
        run: |
          APP="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")
          echo "CFBundleShortVersionString: $BUILT_VERSION"
          echo "CFBundleVersion: $BUILD_NUMBER"
          if [ "$BUILT_VERSION" != "$VERSION" ]; then
            echo "::error::CFBundleShortVersionString ($BUILT_VERSION) does not match tag version ($VERSION)"
            exit 1
          fi

      - name: Create DMG
        run: |
          DMG="${APP_NAME}_${VERSION}.dmg"
          mkdir -p build/dmg
          cp -R "build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder build/dmg -ov -format UDZO "build/$DMG"
          echo "DMG=build/$DMG" >> "$GITHUB_ENV"

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          MESSAGE=""
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            MESSAGE=$(git for-each-ref --format='%(contents:subject)%0a%0a%(contents:body)' "refs/tags/$TAG")
          fi
          {
            if [ -n "$MESSAGE" ]; then
              printf '%s\n' "$MESSAGE"
            elif [ -n "$PREVIOUS_TAG" ]; then
              git log --no-merges --pretty='- %s (%h)' "$PREVIOUS_TAG..$TAG"
            else
              git log --no-merges --pretty='- %s (%h)' "$TAG"
            fi
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$DMG" --title "$APP_NAME $VERSION" --notes-file notes.md
